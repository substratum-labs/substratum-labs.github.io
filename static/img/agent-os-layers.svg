<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">

  <!-- Background -->
  <rect width="900" height="800" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#111">Agent OS: Three Layers, Three Protocols</text>

  <!-- Trust gradient label (left side) -->
  <text x="32" y="130" font-size="11" fill="#dc2626" font-weight="600" transform="rotate(-90, 32, 130)">UNTRUSTED</text>
  <text x="32" y="660" font-size="11" fill="#1e3a8a" font-weight="600" transform="rotate(-90, 32, 660)">TRUSTED</text>
  <line x1="38" y1="100" x2="38" y2="700" stroke="#d1d5db" stroke-width="1.5"/>
  <polygon points="38,100 34,114 42,114" fill="#d1d5db"/>
  <polygon points="38,700 34,686 42,686" fill="#d1d5db"/>

  <!-- ============================================ -->
  <!-- Layer 1: Agent (untrusted)  y=70..190       -->
  <!-- ============================================ -->
  <rect x="70" y="70" width="780" height="120" rx="8" ry="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>

  <text x="90" y="100" font-size="17" font-weight="700" fill="#991b1b">Agent</text>
  <text x="200" y="100" font-size="13" fill="#dc2626">untrusted</text>

  <text x="90" y="125" font-size="12" fill="#7f1d1d">Your code. Task logic, system prompts, ReAct loops, decision chains.</text>
  <text x="90" y="145" font-size="12" fill="#7f1d1d">Communicates only through syscalls. Cannot touch resources directly.</text>

  <rect x="600" y="105" width="230" height="65" rx="4" ry="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.5"/>
  <text x="615" y="123" font-size="10" font-weight="600" fill="#991b1b">Syscalls:</text>
  <text x="615" y="138" font-size="10" fill="#7f1d1d" font-family="ui-monospace, monospace">llm_call  tool_invoke  spawn</text>
  <text x="615" y="153" font-size="10" fill="#7f1d1d" font-family="ui-monospace, monospace">mem_write  mem_search  checkpoint</text>

  <!-- ============================================ -->
  <!-- Protocol 1: Agent ↔ Kernel   pill y=225..255 -->
  <!-- ============================================ -->

  <!-- Protocol pill -->
  <rect x="200" y="225" width="500" height="30" rx="15" ry="15" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="450" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#4b5563">Protocol: capability token + syscall interface</text>

  <!-- Down arrow (Agent → pill) -->
  <line x1="450" y1="195" x2="450" y2="220" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="450,222 446,214 454,214" fill="#6b7280"/>

  <!-- Up arrow (Tools → pill) -->
  <line x1="450" y1="290" x2="450" y2="260" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="450,258 446,266 454,266" fill="#6b7280"/>

  <!-- ============================================ -->
  <!-- Layer 2: Tools & Apps   y=295..425           -->
  <!-- ============================================ -->
  <rect x="70" y="295" width="780" height="130" rx="8" ry="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>

  <text x="90" y="325" font-size="17" font-weight="700" fill="#854d0e">Tools &amp; Apps</text>
  <text x="270" y="325" font-size="13" fill="#ca8a04">semi-trusted</text>

  <rect x="90" y="340" width="340" height="65" rx="4" ry="4" fill="#fef9c3" stroke="#fde047" stroke-width="0.5"/>
  <text x="105" y="358" font-size="11" font-weight="600" fill="#854d0e">Tools (serve agents)</text>
  <text x="105" y="375" font-size="11" fill="#713f12">bash, read_file, web_search, MCP servers</text>
  <text x="105" y="392" font-size="11" fill="#713f12">Scoped permissions, single-use, expiring</text>

  <rect x="450" y="340" width="380" height="65" rx="4" ry="4" fill="#fef9c3" stroke="#fde047" stroke-width="0.5"/>
  <text x="465" y="358" font-size="11" font-weight="600" fill="#854d0e">Apps (serve humans)</text>
  <text x="465" y="375" font-size="11" fill="#713f12">API gateway, dashboard, CLI</text>
  <text x="465" y="392" font-size="11" fill="#713f12">HITL approval, budget mgmt, observability</text>

  <!-- ============================================ -->
  <!-- Protocol 2: Kernel ↔ Tools (left)  pill y=460..490 -->
  <!-- ============================================ -->

  <!-- Left protocol pill -->
  <rect x="100" y="460" width="320" height="30" rx="15" ry="15" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="260" y="480" text-anchor="middle" font-size="11" font-weight="600" fill="#4b5563">Protocol: scoped grant + bidi channel</text>

  <!-- Down arrow (Tools → pill) -->
  <line x1="260" y1="430" x2="260" y2="455" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="260,457 256,449 264,449" fill="#6b7280"/>

  <!-- Up arrow (Kernel → pill) -->
  <line x1="260" y1="525" x2="260" y2="495" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="260,493 256,501 264,501" fill="#6b7280"/>

  <!-- ============================================ -->
  <!-- Protocol 3: Apps ↔ Kernel (right)  pill y=460..490 -->
  <!-- ============================================ -->

  <!-- Right protocol pill -->
  <rect x="470" y="460" width="320" height="30" rx="15" ry="15" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="630" y="480" text-anchor="middle" font-size="11" font-weight="600" fill="#4b5563">Protocol: identity + role (RBAC)</text>

  <!-- Down arrow (Apps → pill) -->
  <line x1="630" y1="430" x2="630" y2="455" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="630,457 626,449 634,449" fill="#6b7280"/>

  <!-- Up arrow (Kernel → pill) -->
  <line x1="630" y1="525" x2="630" y2="495" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="630,493 626,501 634,501" fill="#6b7280"/>

  <!-- ============================================ -->
  <!-- Layer 3: Kernel (trusted)   y=530..690       -->
  <!-- ============================================ -->
  <rect x="70" y="530" width="780" height="160" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>

  <text x="90" y="560" font-size="17" font-weight="700" fill="#1e3a8a">Kernel</text>
  <text x="175" y="560" font-size="13" fill="#3b82f6">trusted execution engine</text>

  <!-- Kernel services grid -->
  <rect x="90" y="575" width="155" height="35" rx="4" ry="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="167" y="597" text-anchor="middle" font-size="11" fill="#1e3a8a">Memory mgmt</text>

  <rect x="255" y="575" width="155" height="35" rx="4" ry="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="332" y="597" text-anchor="middle" font-size="11" fill="#1e3a8a">Budget + Capability</text>

  <rect x="420" y="575" width="155" height="35" rx="4" ry="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="497" y="597" text-anchor="middle" font-size="11" fill="#1e3a8a">Journal + Replay</text>

  <rect x="585" y="575" width="120" height="35" rx="4" ry="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="645" y="597" text-anchor="middle" font-size="11" fill="#1e3a8a">HITL</text>

  <rect x="715" y="575" width="120" height="35" rx="4" ry="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="775" y="597" text-anchor="middle" font-size="11" fill="#1e3a8a">Scheduling</text>

  <rect x="90" y="618" width="155" height="35" rx="4" ry="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="167" y="640" text-anchor="middle" font-size="11" fill="#1e3a8a">LLM routing</text>

  <rect x="255" y="618" width="155" height="35" rx="4" ry="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="332" y="640" text-anchor="middle" font-size="11" fill="#1e3a8a">Checkpoint + Fork</text>

  <!-- Five invariants -->
  <rect x="420" y="618" width="415" height="35" rx="4" ry="4" fill="#bfdbfe" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="627" y="635" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">5 invariants: proxy | journal | capability | suspend | replay</text>

  <!-- Footer -->
  <text x="450" y="735" text-anchor="middle" font-size="12" fill="#6b7280">Agents say "I want to do X."</text>
  <text x="450" y="755" text-anchor="middle" font-size="12" fill="#6b7280">The kernel decides how, enforces limits, and records everything.</text>

</svg>
